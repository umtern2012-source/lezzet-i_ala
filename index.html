<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezzet-i Ala Köfte & Kokoreç</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:white;
padding-bottom:180px;
}

/* LOGO */
.logo-box{
text-align:center;
padding:20px;
}
.logo-box img{
width:170px;
}
.logo-text{
font-size:26px;
font-weight:bold;
color:orange;
}

/* TOP BUTTONS */
.top-buttons{
display:flex;
justify-content:center;
gap:20px;
margin:10px 0 20px;
}

/* IŞIK EFEKTİ */
@keyframes glow{
0%{box-shadow:0 0 5px #ffcc00,0 0 10px #ffcc00;}
50%{box-shadow:0 0 20px #ffd700,0 0 40px #ffd700;}
100%{box-shadow:0 0 5px #ffcc00,0 0 10px #ffcc00;}
}

.top-btn{
width:60px;
height:60px;
border-radius:50%;
background:#111;
border:2px solid orange;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
text-decoration:none;
animation:glow 1.8s infinite;
transition:.2s;
}

.top-btn:hover{
transform:scale(1.1);
}

/* CATEGORY */
.category{
font-size:22px;
font-weight:bold;
color:orange;
margin:25px 10px 10px;
border-bottom:2px solid orange;
padding-bottom:5px;
}

/* PRODUCT */
.product{
background:#111;
padding:12px;
margin:8px;
border-radius:10px;
border:1px solid orange;
cursor:pointer;
transition:.2s;
}

.product:hover{
transform:scale(1.02);
background:#222;
}

.product-name{
font-size:18px;
font-weight:bold;
}
.product-price{
color:gold;
}

/* CART */
#cart{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
border-top:2px solid orange;
padding:10px;
}

#cart-items{
max-height:120px;
overflow:auto;
font-size:14px;
}

.cart-btn{
background:orange;
color:black;
padding:10px;
border:none;
border-radius:8px;
width:100%;
font-weight:bold;
margin-top:5px;
cursor:pointer;
}

.qty-btn{
background:#222;
color:white;
border:none;
padding:2px 6px;
margin:0 3px;
border-radius:5px;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

.popup-box{
background:#111;
padding:20px;
border-radius:10px;
width:90%;
max-width:400px;
border:2px solid orange;
}

.popup-box input{
width:100%;
padding:10px;
margin:5px 0;
}

/* TIME */
.time-box{
height:120px;
overflow:auto;
border:1px solid orange;
padding:5px;
width:60px;
text-align:center;
}
.time-box div{
padding:5px;
cursor:pointer;
}
.time-box div.active{
background:orange;
color:black;
}

/* PAYMENT */
.payment-btn{
background:#333;
color:white;
}
.payment-btn.active{
background:orange;
color:black;
}
</style>
</head>

<body>

<div class="logo-box">
<img src="logo.png">
<div class="logo-text">LEZZET-İ ALA KÖFTE & KOKOREÇ</div>
</div>

<!-- TOP BUTTONS -->
<div class="top-buttons">

<a class="top-btn" href="https://www.instagram.com/lezzetiala.kokorec/" target="_blank">📸</a>

<a class="top-btn" href="https://lezzetialalokanta-ui.github.io/lezzet-i-ala/" target="_blank">🌐</a>

<a class="top-btn" href="https://www.google.com/maps/place/Lezzeti+Al%C3%A2+kokore%C3%A7+k%C3%B6fte/@39.9789349,32.9638533,17z" target="_blank">🗺️</a>

</div>

<!-- MENU -->
<div id="menu"></div>

<!-- CART -->
<div id="cart">
<div id="cart-items"></div>
<div id="total">Toplam: 0 TL</div>
<button class="cart-btn" onclick="openPopup()">Sipariş Ver</button>
<button class="cart-btn" onclick="clearCart()">Sepeti Temizle</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">

<h3>Bilgiler</h3>
<input id="name" placeholder="İsim">
<input id="phone" placeholder="Telefon">
<input id="address" placeholder="Adres">

<h3>Teslim Saati</h3>
<div style="display:flex;gap:10px;justify-content:center">
<div id="leftTime" class="time-box"></div>
<div id="rightTime" class="time-box"></div>
</div>

<h3>Ödeme</h3>
<button class="cart-btn payment-btn" onclick="selectPayment(this,'Nakit')">Nakit</button>
<button class="cart-btn payment-btn" onclick="selectPayment(this,'Kapıda Kart')">Kart</button>
<button class="cart-btn payment-btn" onclick="selectPayment(this,'QR')">QR</button>

<button class="cart-btn" onclick="sendWhatsApp()">Gönder</button>

</div>
</div>

<script>

/* ESKİ MENÜ */
const menuData={
"Ana Yemek":[
["Kokoreç Tüm ekmek",350],
["Köfte ekmek",300],
["Adana kebap",300],
["Kanat",275],
["Tavuk Şiş",175],
["Sucuk ekmek",250],
["Karışık Kebap",800]
],
"İçecek":[
["Kola Kutu",70],
["Fanta Kutu",70],
["Ayran Küçük",30],
["Ayran Büyük",40],
["Şalgam",50],
["Su",20]
],
"Tatlı":[
["Fırın Sütlaç",80]
]
};

let cart={};
let selectedHour="",selectedMinute="",selectedPayment="";

const menu=document.getElementById("menu");

for(let cat in menuData){
menu.innerHTML+=`<div class="category">${cat}</div>`;
menuData[cat].forEach(i=>{
menu.innerHTML+=`
<div class="product" onclick="addToCart('${i[0]}',${i[1]})">
<div class="product-name">${i[0]}</div>
<div class="product-price">${i[1]} TL</div>
</div>`;
});
}

function addToCart(n,p){
if(cart[n])cart[n].qty++;
else cart[n]={price:p,qty:1};
update();
}

function update(){
let h="",t=0;
for(let i in cart){
h+=`${i} x${cart[i].qty} = ${cart[i].qty*cart[i].price} TL<br>`;
t+=cart[i].qty*cart[i].price;
}
document.getElementById("cart-items").innerHTML=h;
document.getElementById("total").innerText="Toplam: "+t+" TL";
}

function clearCart(){cart={};update();}
function openPopup(){document.getElementById("popup").style.display="flex";}

function selectPayment(b,t){
document.querySelectorAll(".payment-btn").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
selectedPayment=t;
}

function sendWhatsApp(){
let msg="Sipariş%0A";
for(let i in cart){
msg+=i+" x"+cart[i].qty+"%0A";
}
window.open("https://wa.me/905337750685?text="+msg);
}

</script>

</body>
</html>
