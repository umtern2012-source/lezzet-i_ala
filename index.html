<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezzet-i Ala</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;padding-bottom:180px}

.logo-box{text-align:center;padding:20px}
.logo-text{color:orange;font-size:26px;font-weight:bold}

/* BUTONLAR */
.top-buttons{display:flex;justify-content:center;gap:20px;margin:10px}

@keyframes glow{
0%{box-shadow:0 0 5px #ffcc00}
50%{box-shadow:0 0 25px #ffd700}
100%{box-shadow:0 0 5px #ffcc00}
}

.top-btn{
width:60px;height:60px;border-radius:50%;
background:#111;border:2px solid orange;
display:flex;align-items:center;justify-content:center;
font-size:28px;text-decoration:none;
animation:glow 1.8s infinite;
}

/* MENU */
.category{color:orange;font-size:22px;margin:20px 10px;border-bottom:2px solid orange}

.product{
background:#111;margin:8px;padding:10px;
border:1px solid orange;border-radius:10px;
cursor:pointer
}

.product-price{color:gold}

/* CART */
#cart{
position:fixed;
bottom:0;
width:100%;
background:#111;
border-top:2px solid orange;
padding:10px
}

.cart-btn{
width:100%;
background:orange;
color:#000;
padding:10px;
border:none;
margin-top:5px;
font-weight:bold
}
</style>
</head>

<body>

<div class="logo-box">
<div class="logo-text">LEZZET-İ ALA KÖFTE & KOKOREÇ</div>
</div>

<div class="top-buttons">
<a class="top-btn" href="https://instagram.com/lezzetiala.kokorec" target="_blank">📸</a>
<a class="top-btn" href="https://lezzetialalokanta-ui.github.io/lezzet-i-ala/" target="_blank">🌐</a>
<a class="top-btn" href="https://maps.google.com" target="_blank">🗺️</a>
</div>

<div id="menu"></div>

<div id="cart">
<div id="cart-items"></div>
<div id="total">Toplam: 0 TL</div>
</div>

<script>

/* YENİ MENÜ */
const menuData = {

"Ana Yemek":[
["Kokoreç",350],
["Köfte",300],
["Adana",300],
["Kanat",275],
["Tavuk Şiş",175],
["Sucuk",250],
["Karışık Kebap",800]
],

"Kiloluk Ürünler":[
["Kilo ile Kanat",800],
["Yarım kilo Kanat",400],
["Kilo ile Köfte",1750],
["Yarım kilo Köfte",875],
["Kilo ile Tavuk şiş",600],
["Yarım kilo Tavuk şiş",300]
],

"İçecek":[
["Şişe Kola",60],
["Kola Kutu",70],
["Fanta Kutu",70],
["Ayran Küçük",40],
["Ayran Büyük",40],
["Safiş Ayran",40],
["Şalgam",50],
["Kola 1L",100],
["Fanta 1L",100],
["Ayran 1L",75],
["Meyveli Soda",30],
["Sade Soda",25],
["Niğde Gazozu",40],
["Su",20]
],

"Tatlı":[
["Fırın Sütlaç",80]
],

"Yan Ürünler":[
["Midye",20],
["Atom Kokoreç",450],
["Şırdan",350],
["Mumbar",400],
["Dürüm Kokoreç",360]
]

};

let menu = document.getElementById("menu");

for(let cat in menuData){
menu.innerHTML += `<div class="category">${cat}</div>`;

menuData[cat].forEach(item=>{
menu.innerHTML += `
<div class="product">
<b>${item[0]}</b>
<div class="product-price">${item[1]} TL</div>
</div>
`;
});
}

</script>

</body>
</html>
