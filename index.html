<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezzet-i Ala</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff;padding-bottom:220px}

.logo-box{text-align:center;padding:20px}
.logo-text{color:orange;font-size:26px;font-weight:bold}

/* BUTONLAR */
.top-buttons{display:flex;justify-content:center;gap:20px;margin:10px}

@keyframes glow{
0%{box-shadow:0 0 5px #ffcc00}
50%{box-shadow:0 0 25px #ffd700}
100%{box-shadow:0 0 5px #ffcc00}
}

.top-btn{
width:60px;height:60px;border-radius:50%;
background:#111;border:2px solid orange;
display:flex;align-items:center;justify-content:center;
font-size:28px;text-decoration:none;
animation:glow 1.8s infinite;
}

/* MENU */
.category{color:orange;font-size:22px;margin:20px 10px;border-bottom:2px solid orange}

.product{
background:#111;margin:8px;padding:12px;
border:1px solid orange;border-radius:10px;
cursor:pointer
}

.product-price{color:gold}

/* CART */
#cart{
position:fixed;
bottom:0;
width:100%;
background:#111;
border-top:2px solid orange;
padding:10px
}

#cart-items{font-size:14px}

.cart-btn{
width:100%;
background:orange;
color:#000;
padding:10px;
border:none;
margin-top:5px;
font-weight:bold;
cursor:pointer
}

.qty-btn{
background:#222;color:#fff;border:none;
padding:2px 6px;margin:0 3px;border-radius:5px;
cursor:pointer
}

/* POPUP */
.popup{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.8);
display:none;justify-content:center;align-items:center
}

.popup-box{
background:#111;padding:20px;
border-radius:10px;width:90%;max-width:400px;
border:2px solid orange
}

.popup-box input{
width:100%;padding:10px;margin:5px 0;border:none
}
</style>
</head>

<body>

<div class="logo-box">
<div class="logo-text">LEZZET-İ ALA KÖFTE & KOKOREÇ</div>
</div>

<div class="top-buttons">
<a class="top-btn" href="https://instagram.com/lezzetiala.kokorec" target="_blank">📸</a>
<a class="top-btn" href="https://lezzetialalokanta-ui.github.io/lezzet-i-ala/" target="_blank">🌐</a>
<a class="top-btn" href="https://maps.google.com" target="_blank">🗺️</a>
</div>

<div id="menu"></div>

<div id="cart">
<div id="cart-items"></div>
<div id="total">Toplam: 0 TL</div>
<button class="cart-btn" onclick="openPopup()">Sipariş Ver</button>
<button class="cart-btn" onclick="clearCart()">Sepeti Temizle</button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">

<h3>Bilgiler</h3>
<input id="name" placeholder="İsim">
<input id="phone" placeholder="Telefon">
<input id="address" placeholder="Adres">

<h3>Ödeme</h3>
<button class="cart-btn" onclick="setPay('Nakit')">Nakit</button>
<button class="cart-btn" onclick="setPay('Kart')">Kapıda Kart</button>
<button class="cart-btn" onclick="setPay('QR')">QR</button>

<button class="cart-btn" onclick="sendWhatsApp()">WhatsApp Gönder</button>

</div>
</div>

<script>

const menuData = {

"Ana Yemek":[
["Kokoreç",380],
["Atom Kokoreç",350],
["Özel Sarım Kokoreç",350],
["Yarım özel sarım Kokoreç",350],
["Dürüm Özel sarım Kokoreç",350],
["yarım ekm. atom Kokoreç",350],
["Atom Dürüm Kokoreç",350],
["Yarım Ekm. Kokoreç",350],
["Dürüm Kokoreç",390],
["Köfte Ekmek",330],
["köfte Servis",300],
["Köfte Yarım Ekmek",350],
["Adana Dürüm",350],
["Adana Servis",370],
["Kanat",300],
["Tavuk Şiş",200],
["Tavuk Şiş Servis",350],
["Sucuk Ekmek",250],
["Karışık Kebap",800]
],

"Kiloluk Ürünler":[
["Kilo ile Kanat",1400],
["Yarım kilo Kanat",700],
["Kilo ile Köfte",1600],
["Yarım kilo Köfte",800],
["Kilo ile Tavuk şiş",750],
["Yarım kilo Tavuk şiş",375]
],

"İçecek":[
["Kola Kutu",80],
["Fanta Kutu",80],
["Ayran Küçük",40],
["Ayran Büyük",50],
["Safiş Yayık",60],
["Safiş Ekşi",60],
["Safiş Naneli",60],
["Safiş Acılı",60],
["Safiş Yayık",60],
["Özerhisar Cam şişe",70],
["Özerhisar pet şişe",60],
["Şalgam",60],
["Kola 1L",130],
["Fanta 1L",130],
["Ayran 1L",100],
["Meyveli Soda",50],
["Sade Soda",40],
["ıce tea",40],
["Su",20]
],

"Tatlı":[["Fırın Sütlaç",80]],

"Yan Ürünler":[
["Midye",20],
["Şırdan",350],
["Mumbar",400],
]

};

let cart = {};
let payment = "";

const menu = document.getElementById("menu");

for(let cat in menuData){
menu.innerHTML += `<div class="category">${cat}</div>`;
menuData[cat].forEach(item=>{
menu.innerHTML += `
<div class="product" onclick="addToCart('${item[0]}',${item[1]})">
<b>${item[0]}</b>
<div class="product-price">${item[1]} TL</div>
</div>`;
});
}

function addToCart(name,price){
if(cart[name]) cart[name].qty++;
else cart[name]={price:price,qty:1};
updateCart();
}

function updateCart(){
let html="", total=0;
for(let name in cart){
let item=cart[name];
html+=`${name} x${item.qty} = ${item.qty*item.price} TL
<button class="qty-btn" onclick="decrease('${name}')">-</button>
<button class="qty-btn" onclick="increase('${name}')">+</button><br>`;
total+=item.qty*item.price;
}
document.getElementById("cart-items").innerHTML=html;
document.getElementById("total").innerText="Toplam: "+total+" TL";
}

function increase(name){cart[name].qty++;updateCart();}
function decrease(name){cart[name].qty--;if(cart[name].qty<=0) delete cart[name];updateCart();}
function clearCart(){cart={};updateCart();}

function openPopup(){
if(Object.keys(cart).length==0){alert("Sepet boş!");return;}
document.getElementById("popup").style.display="flex";
}

function setPay(type){
payment=type;
}

function sendWhatsApp(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;

let msg="Yeni Sipariş%0A";
msg+="İsim: "+name+"%0A";
msg+="Telefon: "+phone+"%0A";
msg+="Adres: "+address+"%0A";
msg+="Ödeme: "+payment+"%0A%0A";

let total=0;

for(let item in cart){
msg+=item+" x"+cart[item].qty+" - "+(cart[item].price*cart[item].qty)+" TL%0A";
total+=cart[item].price*cart[item].qty;
}

msg+="%0AToplam: "+total+" TL";

window.open("https://wa.me/905337750685?text="+msg);
}

</script>

</body>
</html>
